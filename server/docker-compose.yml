version: '3.8'
services:
  db:
    image: postgres:15
    container_name: credentialverify_db
    restart: always
    environment:
      POSTGRES_USER: cv_admin
      POSTGRES_PASSWORD: cv_password
      POSTGRES_DB: credentialverify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
